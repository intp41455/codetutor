    <script>
      (function() {
        // Prevent benign sandboxed WebSocket HMR closure errors in iframe/Cloud Run environments
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          class SafeDevWebSocket extends EventTarget {
            static CONNECTING = 0;
            static OPEN = 1;
            static CLOSING = 2;
            static CLOSED = 3;

            CONNECTING = 0;
            OPEN = 1;
            CLOSING = 2;
            CLOSED = 3;

            readyState = 1;
            url = '';
            protocol = '';
            bufferedAmount = 0;
            extensions = '';
            binaryType = 'blob';

            onopen = null;
            onclose = null;
            onerror = null;
            onmessage = null;

            constructor(url, protocols) {
              super();
              this.url = String(url);
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
              queueMicrotask(() => {
                const ev = new Event('open');
                if (typeof this.onopen === 'function') {
                  try { this.onopen(ev); } catch (e) {}
                }
                this.dispatchEvent(ev);
              });
            }

            send() {}

            close(code, reason) {
              this.readyState = 3;
              const ev = new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true });
              if (typeof this.onclose === 'function') {
                try { this.onclose(ev); } catch (e) {}
              }
              this.dispatchEvent(ev);
            }
          }

          try {
            Object.setPrototypeOf(SafeDevWebSocket.prototype, OriginalWebSocket.prototype);
          } catch (e) {}

          window.WebSocket = function(url, protocols) {
            const isVite = (
              protocols === 'vite-hmr' || 
              protocols === 'vite-ping' || 
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              String(url).includes('token=') || 
              String(url).includes('vite')
            );
            if (isVite) {
              return new SafeDevWebSocket(url, protocols);
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global unhandledrejection & error suppression for any residual WebSocket events
        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = event.reason ? (typeof event.reason === 'string' ? event.reason : (event.reason.message || String(event.reason))) : '';
          if (reasonStr.toLowerCase().includes('websocket') || reasonStr.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          if (msg.toLowerCase().includes('websocket') || msg.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Filter console.error from [vite] websocket failures
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (
            args[0].includes('[vite] failed to connect to websocket') || 
            args[0].includes('WebSocket closed without opened')
          )) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
